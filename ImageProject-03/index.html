<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('move-backwards', {
      init: function () {
        var el = this.el;
        
        el.addEventListener('click', function (evt) {
          
          var pos = el.getAttribute('position');
          
          var newX = pos.x - 0.2;

          el.setAttribute('animation', {
            property: 'position',
            to: newX + ' ' + pos.y + ' ' + pos.z,
            dur: 300,
            easing: 'easeOutQuad'
          });
        });
      }
    });

    AFRAME.registerComponent('move-left-of-user', {
      init: function () {
        var el = this.el;
        
        el.addEventListener('click', function () {
          
          var cameraEl = document.querySelector('[camera]');
          if (!cameraEl) return;

          var cameraRotation = cameraEl.getAttribute('rotation');
          var yawRad = (cameraRotation.y - 90) * (Math.PI / 180); // shifts forward to exact left

          var distance = 2.0;

          var offsetX = Math.sin(yawRad) * distance;
          var offsetZ = Math.cos(yawRad) * distance;

          var currentPos = el.getAttribute('position');
          var targetX = currentPos.x - offsetX;
          var targetZ = currentPos.z - offsetZ;

          el.setAttribute('animation', {
            property: 'position',
            to: targetX + ' ' + currentPos.y + ' ' + targetZ,
            dur: 400,
            easing: 'easeInOutQuad'
          });
        });
      }
    });
  </script>
</head>

<body>
  <a-scene>

    <a-assets>
      <a-asset-item id="legoclone" src="./LegoMan.glb"></a-asset-item>
      <a-asset-item id="droid" src="./droid.glb"></a-asset-item>
    </a-assets>

    <a-sky src="./spaceship.png"></a-sky>

    <a-entity camera look-controls position="0 1.6 5">
      <a-cursor raycaster="objects: [move-backwards], [move-left-of-user]"></a-cursor>
    </a-entity>

    <a-entity
      gltf-model="#legoclone"
      position="-5 0 5"
      rotation="90 90 0"
      scale="50 50 50"
      move-backwards>
    </a-entity>

    <a-entity
      gltf-model="#droid"
      position="-5 0 7"
      rotation="0 120 0"
      scale="30 30 30"
      material="color: #000000; shader: flat"
      move-left-of-user>
    </a-entity>

  </a-scene>
</body>
</html>
